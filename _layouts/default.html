<!doctype html>
<html class="no-js" lang="en-US">
    {% include head.html %}
    <body>
        <div class="site">
            {% include nav.html %}
            {{ content }}
            {% include foot.html %}
        </div>

        <!-- Moderizr Custom Build -->
        <script async src="{{site.url}}/js/modernizr-custom.min.js"></script>

        <!-- Global site tag (gtag.js) - Google Analytics -->
        <script async src="https://www.googletagmanager.com/gtag/js?id=UA-60499701-1"></script>
        <script>
            window.dataLayer = window.dataLayer || [];
            function gtag(){dataLayer.push(arguments);}
            gtag('js', new Date());
            gtag('config', 'UA-60499701-1');
        </script>

        <!-- Isso Comment Count -->
        <script data-isso="https://comments.willpresley.com/" src="https://comments.willpresley.com/js/count.min.js"></script>
    </body>
</html>
