<!doctype html>
<html class="no-js" lang="en-US">

    {% include head.html %}

    <body>
        <div class="site">
            {% include nav.html %}
            {{ content }}
            {% include foot.html %}
        </div>
    </body>

    <!-- Theme Switch EventListeners -->
    <script>document.addEventListener("DOMContentLoaded",()=>{document.getElementById("s").addEventListener("click",toggleT,!1),document.getElementById("d").addEventListener("click",toggleT,!1),document.getElementById("l").addEventListener("click",toggleT,!1)});</script>

    <!-- Moderizr Custom Build -->
    <script async src="{{site.url}}/js/modernizr-custom.min.js"></script>

    <!-- Global site tag (gtag.js) - Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=UA-60499701-1"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'UA-60499701-1');
    </script>

    {% if page.comments != true and page.add-counter == true %}
    <!-- Isso Comment Count -->
    <script async data-isso="https://comments.willpresley.com/" src="https://comments.willpresley.com/js/count.min.js"></script>
    {% endif %}
</html>
