name: Code Quality

on:
    push:
        branches: ["main", "master"]
    pull_request:
        branches: ["main", "master"]
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    lint:
        name: Lint SCSS, JS, JSON & Ruby
        runs-on: ubuntu-latest

        steps:
            - name: Checkout Repository
              uses: actions/checkout@v4

            - name: Setup Node.js LTS
              uses: actions/setup-node@v4
              with:
                  node-version: "lts/*"

            # Repo has no package.json; tooling is installed ephemerally on the runner only
            - name: Install Stylelint
              run: npm install --no-save stylelint@14 stylelint-config-sass-guidelines@9 stylelint-scss@4 stylelint-order@5 postcss-scss@4

            # Vendored/third-party SCSS is excluded via .stylelintignore
            - name: Lint SCSS
              run: npx stylelint "_sass/**/*.scss" --custom-syntax postcss-scss

            # Minified files are build output, so only hand-written JS is checked
            - name: Check JS Syntax
              run: |
                  for f in js/theme-switch.js js/wp-dotcom-isso-scripts.js js/wp-dotcom-scripts.js; do
                    echo "Checking $f"
                    node --check "$f"
                  done

            - name: Validate JSON Files
              run: |
                  for f in feed.json site.webmanifest; do
                    echo "Validating $f"
                    [ -f "$f" ] || continue
                    # feed.json is a Liquid template; only validate plain JSON files
                    if grep -q '{%\|{{' "$f"; then echo "Skipping Liquid template $f"; continue; fi
                    node -e "JSON.parse(require('fs').readFileSync('$f','utf8'))"
                  done

            - name: Check Ruby Plugin Syntax
              run: |
                  if command -v ruby >/dev/null 2>&1; then
                    for f in _plugins/*.rb; do
                      ruby -c "$f"
                    done
                  else
                    echo "Ruby not present on this runner; plugin syntax will be verified in the build job"
                  fi

    build:
        name: Jekyll Build Check
        runs-on: ubuntu-latest

        steps:
            - name: Checkout Repository
              uses: actions/checkout@v4

            - name: Setup Ruby
              uses: ruby/setup-ruby@v1
              with:
                  ruby-version: "3.3"

            - name: Check Ruby Plugin Syntax (Ruby 3.3)
              run: |
                  for f in _plugins/*.rb; do
                    ruby -c "$f"
                  done

            # The repo has no Gemfile (the server keeps its own), so one is generated outside the workspace
            - name: Install Jekyll & Plugin Gems
              run: |
                  TEMP_DIR="${RUNNER_TEMP:-/tmp}"
                  cat > "$TEMP_DIR/Gemfile" <<'EOF'
                  source "https://rubygems.org"
                  gem "jekyll", "~> 4.3"
                  gem "kramdown-parser-gfm"
                  gem "rouge"
                  gem "webrick"
                  gem "rexml"
                  gem "nokogiri"
                  gem "classifier-reborn"
                  gem "jekyll-target-blank"
                  gem "jekyll-inline-svg"
                  EOF
                  echo "BUNDLE_GEMFILE=$TEMP_DIR/Gemfile" >> "$GITHUB_ENV"
                  BUNDLE_GEMFILE="$TEMP_DIR/Gemfile" bundle install --jobs 4

            # head.html hashes CSS via the hardcoded server path /home/will/jekyll, so the checkout is linked there
            - name: Link Checkout to Server Path
              run: |
                  if [ "$(id -u)" -eq 0 ]; then
                    mkdir -p /home/will
                    ln -sfn "$PWD" /home/will/jekyll
                  elif command -v sudo >/dev/null 2>&1; then
                    sudo mkdir -p /home/will
                    sudo ln -sfn "$PWD" /home/will/jekyll
                  fi

            # _config.yml 'source' is a server path, so the checkout is passed explicitly
            - name: Build Site
              run: |
                  TEMP_DIR="${RUNNER_TEMP:-/tmp}"
                  bundle exec jekyll build --source . --destination "$TEMP_DIR/_site" --trace
