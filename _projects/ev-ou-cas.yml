project_description:
  "
  <ul>
  <li>Created a set of templates in CommonSpot that start with a base, and are abstracted out for specific page types.</li>
  <li>Implement a custom responsive grid system based on the provided design.</li>
  <li>Write various helper scripts using both vanilla Javascript and jQuery to address missing/overly-complex aspects of the CMS.</li>
  <li>Create and document a full management dashboard for non-technical users.</li>
  <li>Organize and conduct training sessions for University staff who will be updating various parts of the site.</li>
  </ul>
  "
