layout: project
description:
  "
  <p><em>Project for Electronic Vision.</em></p>
  <p>A rebuild of the entire website for the College of Arts & Sciences at Ohio University, including its many departments, in the CommonSpot CMS. CommonSpot is a Cold-Fusion powered CMS that is jointly controlled by both the software vendor and the University IT staff. The site is fully responsive, and also features a management dashboard so that individuals from varying academic units can update various parts of their sites easily.</p>
  "
